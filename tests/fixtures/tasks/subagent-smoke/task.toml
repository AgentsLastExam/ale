# Does a Harness turn a delegated subagent into a subagent trajectory?
#
# Only a subagent may write the marker, so a live run shows both that the agent can spawn
# one and, from the trajectory, that ALE attributes the child's work to the child. The
# verifier checks the file; live acceptance checks the trajectory. Nothing here needs the
# parent to receive the child's result, which a one-shot OpenClaw run cannot deliver yet.
schema_version = "1.4"
artifacts = ["/home/user/output"]

[task]
name = "agentslastexam/subagent-smoke"
keywords = ["smoke", "subagents"]

[environment]
docker_image = "ghcr.io/agentslastexam/container-ubuntu22-base:latest"
cpus = 1
memory_mb = 2048

[agent]
user = "user"
timeout_sec = 900
network_mode = "no-network"

[verifier]
timeout_sec = 60
