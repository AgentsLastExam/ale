[project]
name = "orbit-verify"
version = "0.2.0"
description = "Sandbox-local verification composition for Orbit tasks"
requires-python = ">=3.12"
dependencies = [
    "fastjsonschema==2.21.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
