[project]
name = "orbit-fleet"
version = "0.2.0"
description = "Orbit Fleet: the control plane that pools Sandbox capacity across machines, and the node agent that lends a machine to it"
requires-python = ">=3.12"
dependencies = [
    "orbit-core",
    "orbit-run",
    "aiohttp>=3.11",
    "pydantic>=2.9",
    "typer>=0.15",
]

[project.scripts]
orbit-fleet = "orbit.fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
orbit-core = { workspace = true }
orbit-run = { workspace = true }

# `orbit` is a PEP 420 namespace package shared with orbit-core and orbit-run: there is
# deliberately no src/orbit/__init__.py in any of them.
[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]
