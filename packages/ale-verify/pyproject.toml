[project]
name = "ale-verify"
version = "0.1.0"
description = "Sandbox-local verification composition for ALE tasks"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ale_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
