[agent]
name = "antigravity-cli"
model = "gemini-4-argon"
version = "1.4.7"
skills = []
mcp_servers = []

[agent.settings]
effort = "high"

[gateway]
dialect = "gemini"
base_url = "https://generativelanguage.googleapis.com"
