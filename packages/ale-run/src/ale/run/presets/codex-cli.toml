[agent]
name = "codex-cli"
authentication = "auto"
model = "gpt-5.6-luna"
version = "0.146.0"
skills = []
mcp_servers = []

[agent.settings]
reasoning_effort = "default"
web_search = true

[gateway]
provider = "openai"
dialect = "openai-responses"

[gateway.limits]
max_model_calls = "unlimited"
max_input_tokens = "unlimited"
max_output_tokens = "unlimited"
max_total_tokens = "unlimited"
