[project]
name = "ale-run"
version = "0.1.0"
description = "ALE orchestrator: providers, gateway, guest service, harnesses, CLI"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.27",
    "ale-core",
    "typer>=0.15",
    "aiohttp>=3.11",
    "pyyaml>=6.0",
]

[project.scripts]
ale = "ale.run.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ale-core = { workspace = true }

# `ale` is a PEP 420 namespace package shared with ale-core: there is deliberately no
# src/ale/__init__.py in either package.
[tool.hatch.build.targets.wheel]
packages = ["src/ale"]

[tool.hatch.build]
artifacts = ["src/ale/run/presets/*.toml"]
