[agent]
name = "opencode"
model = "gpt-5.6-luna"
version = "2.3.2"
skills = []
mcp_servers = []

[agent.settings]
reasoning_effort = "default"
context_window = "default"
max_output_tokens = "default"
input = "default"
max_steps = "default"
web_search = "off"

[gateway]
provider = "openai"
dialect = "openai-chat-completions"

[gateway.limits]
max_model_calls = "unlimited"
max_input_tokens = "unlimited"
max_output_tokens = "unlimited"
max_total_tokens = "unlimited"
