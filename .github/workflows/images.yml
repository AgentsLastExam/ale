name: images

# Every Orbit image is published once per version and never again: a version the registry
# already has is skipped, so an image never changes under the engines and Tasks that use it.
# The builder and runner share the engine's version (packages/orbit-run/pyproject.toml); a
# base has its own (BASES in packages/orbit-run/src/orbit/run/__init__.py). To publish a
# changed image, raise its version. The gVisor runtime is the exception: its version
# (VERSION in images/runtimes/gvisor/build.sh) stays 0.1.0 while Orbit is in development,
# and it is published again whenever its build id (`build.sh --id`) changes, which every
# engine checks its build against.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'packages/orbit-run/pyproject.toml'
      - 'packages/orbit-run/src/orbit/run/__init__.py'
  pull_request:
    paths:
      - 'images/**'
  workflow_dispatch:
    inputs:
      promote_repository:
        description: Give an existing image a version (repository, e.g. container-ubuntu22-base)
        required: false
        default: ''
      promote_source:
        description: The existing image, as a tag or sha256 digest
        required: false
        default: ''
      promote_version:
        description: The version to publish it as (X.Y.Z, never already published)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_repository == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: container-ubuntu22-base
            dockerfile: images/base/container-ubuntu22/Dockerfile
            context: images/base/container-ubuntu22
          - repository: orbit-vm-materializer
            dockerfile: images/builders/vm-materializer/Dockerfile
            context: images/builders/vm-materializer
          - repository: orbit-qemu-runner
            dockerfile: images/runtimes/qemu-runner/Dockerfile
            context: images/runtimes/qemu-runner
          - repository: orbit-firecracker-runner
            dockerfile: images/runtimes/firecracker-runner/Dockerfile
            context: images/runtimes/firecracker-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is published
        id: release
        run: |
          case "${{ matrix.repository }}" in
            *-base) version=$(sed -n 's/.*"${{ matrix.repository }}": "\([0-9.]*\)".*/\1/p' packages/orbit-run/src/orbit/run/__init__.py) ;;
            *) version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/orbit-run/pyproject.toml) ;;
          esac
          [ -n "$version" ] || { echo "::error::no version for ${{ matrix.repository }}"; exit 1; }
          image="ghcr.io/agentslastexam/${{ matrix.repository }}:$version"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published and stays as it is"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.release.outputs.published == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.release.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Orbit's Linux VM base is a VM disk, not a container image: its build.sh makes the disk
  # from its Dockerfile's root filesystem with the VM builder, and `orbit vm-image push`
  # publishes it. Its version is in BASES, like the container base's.
  vm-ubuntu24-base:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_repository == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is published
        id: release
        run: |
          version=$(sed -n 's/.*"vm-ubuntu24-base": "\([0-9.]*\)".*/\1/p' packages/orbit-run/src/orbit/run/__init__.py)
          [ -n "$version" ] || { echo "::error::no version for vm-ubuntu24-base"; exit 1; }
          image="ghcr.io/agentslastexam/vm-ubuntu24-base:$version"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published and stays as it is"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The root filesystem's image, its export and the disk take about 25 GB. This runs
      # before uv is installed, which goes to the tool cache it removes.
      - name: Free disk space
        if: steps.release.outputs.published == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.release.outputs.published == 'false'
        with:
          enable-cache: true

      # build.sh and `orbit vm-image push` read the disk with qemu-img, which the runner
      # lacks.
      - name: Install qemu-img
        if: steps.release.outputs.published == 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils

      # The VM builder is the engine's: pulled once published, built here while a new
      # version is still under review.
      - name: Build
        if: steps.release.outputs.published == 'false'
        run: |
          images/build.sh orbit-vm-materializer
          images/base/vm-ubuntu24/build.sh "$RUNNER_TEMP/vm-ubuntu24-base.qcow2"

      - name: Publish
        if: steps.release.outputs.published == 'false' && github.event_name != 'pull_request'
        run: >-
          uv run orbit vm-image push "$RUNNER_TEMP/vm-ubuntu24-base.qcow2"
          "${{ steps.release.outputs.image }}"

  # Orbit's gVisor runtime is built by gVisor's own Bazel build, which build.sh runs before
  # it builds the image, and is published whenever its build id (build.sh --id) differs from
  # the registry's.
  gvisor:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_repository == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this build is published
        id: release
        run: |
          version=$(sed -n 's/^VERSION=\([0-9.]*\)$/\1/p' images/runtimes/gvisor/build.sh)
          [ -n "$version" ] || { echo "::error::no version for orbit-gvisor"; exit 1; }
          build=$(images/runtimes/gvisor/build.sh --id)
          image="ghcr.io/agentslastexam/orbit-gvisor:$version"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          published=$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' \
            2>/dev/null | python3 -c 'import json, sys
          image = json.load(sys.stdin)
          image = image if "config" in image else next(iter(image.values()))
          print(image["config"].get("Labels", {}).get("orbit.gvisor.build", ""))' || true)
          if [ "$published" = "$build" ]; then
            echo "$image is build $build already"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # gVisor's builder image and Bazel cache take about 15 GB.
      - name: Free disk space
        if: steps.release.outputs.published == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Build
        if: steps.release.outputs.published == 'false'
        run: images/runtimes/gvisor/build.sh "$RUNNER_TEMP/gvisor"

      - name: Publish
        if: steps.release.outputs.published == 'false' && github.event_name != 'pull_request'
        run: docker push "${{ steps.release.outputs.image }}"

  # Give an image that was published without a version (such as a floating tag's current
  # target) a version, by pointing a new tag at the very same manifest. Nothing is rebuilt.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_repository != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ${{ inputs.promote_repository }}
      SOURCE: ${{ inputs.promote_source }}
      VERSION: ${{ inputs.promote_version }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the existing image under its version
        run: |
          [[ "$REPOSITORY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid repository"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          image="ghcr.io/agentslastexam/$REPOSITORY"
          case "$SOURCE" in
            sha256:*) source="$image@$SOURCE" ;;
            *) source="$image:$SOURCE" ;;
          esac
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo "::error::$image:$VERSION is already published; a version never changes"
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$VERSION" "$source"
          docker buildx imagetools inspect "$image:$VERSION"
