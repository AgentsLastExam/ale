name: images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'packages/ale-run/src/ale/run/guestd/**'
  pull_request:
    paths:
      - 'images/**'
      - 'packages/ale-run/src/ale/run/guestd/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - path: images/base/container-ubuntu22
            inputs: images/base/container-ubuntu22 packages/ale-run/src/ale/run/guestd
            repository: container-ubuntu22-base
            version: latest
            context: .
          - path: images/base/vm-ubuntu24
            inputs: images/base/vm-ubuntu24 images/builders/vm-materializer/10-root.conf packages/ale-run/src/ale/run/guestd
            repository: vm-ubuntu24-base
            version: 0.1.0
            context: .
          - path: images/builders/vm-materializer
            inputs: images/builders/vm-materializer
            repository: ale-vm-materializer
            version: 0.1.0
            context: images/builders/vm-materializer
          - path: images/runtimes/qemu-runner
            inputs: images/runtimes/qemu-runner
            repository: ale-qemu-runner
            version: 0.1.0
            context: images/runtimes/qemu-runner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute content tag
        id: tag
        run: |
          hash=$(git ls-files -s ${{ matrix.inputs }} \
                 | sha256sum | cut -c1-12)
          echo "content=$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/agentslastexam/${{ matrix.repository }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/agentslastexam/${{ matrix.repository }}:${{ steps.tag.outputs.content }}
          labels: ale.content_hash=${{ steps.tag.outputs.content }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
