name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# No pull_request trigger: development goes straight to main during the initial build-out.
# It also removes a failure mode — the paths filter calls the PR files API, which needs a
# `pull-requests: read` grant this repository does not give, so PR runs failed on
# permissions rather than on anything about the code.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.importlinter'
            images:
              - 'images/**'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -m unit

  verification-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest packages/ale-verify/tests

  live-verification:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Run live judge acceptance
        if: env.OPENAI_API_KEY != '' || env.ANTHROPIC_API_KEY != ''
        run: uv run pytest tests/acceptance/test_live_llm_judge.py tests/acceptance/test_live_agent_judge.py

  # Docker is preinstalled on GitHub-hosted runners, so the container backend is
  # exercised on every code change.
  container-backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # One -m, not two: a second `-m` replaces the first rather than intersecting, so
      # the earlier form silently ran every non-KVM test including the unit suite.
      # The desktop image is tens of gigabytes, so it stays out of hosted CI.
      - run: uv run pytest -m "(conformance or integration) and not needs_kvm and not needs_gui"

  # Hardware virtualisation is not available on hosted runners; this job only runs
  # where a self-hosted runner advertises KVM.
  vm-backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, kvm]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      # Built once and then reused: it is a multi-gigabyte disk, and rebuilding it per
      # run would dominate the job while testing the build script rather than the code.
      # A runner without libguestfs simply leaves it absent, and the tests below skip.
      - name: Build the guest image if this runner has none
        continue-on-error: true
        run: |
          test -s "$HOME/.cache/ale/images/ale-ubuntu-desktop.qcow2" || bash images/base/qemu/build-desktop.sh
      # Skips itself when no guest image is present, so a runner without one reports
      # honestly rather than failing for a reason unrelated to the change.
      - run: uv run pytest -m needs_kvm

  # The desktop image is far too large for hosted runners, so GUI coverage runs where
  # it is already pulled.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, desktop]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -m needs_gui
