name: v1.1 uv release shared-layer experiment

on:
  push:
    branches: [validation/v11-uv-release-layer-4f646e2-20261020]

permissions:
  contents: read

jobs:
  uv-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build two synthetic images from the pinned release binary
        run: |
          mkdir -p "$RUNNER_TEMP/uv-a" "$RUNNER_TEMP/uv-b"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          dockerfile='''FROM ghcr.io/agentslastexam/container-ubuntu22-base:0.1.0
          RUN set -eu; \\
              curl -fLsS --retry 3 --connect-timeout 20 https://github.com/astral-sh/uv/releases/download/0.11.3/uv-x86_64-unknown-linux-gnu.tar.gz -o /tmp/uv-release.tar.gz; \\
              echo "c0f3236f146e55472663cfbcc9be3042a9f1092275bbe3fe2a56a6cbfd3da5ce  /tmp/uv-release.tar.gz" | sha256sum -c -; \\
              tar -xzOf /tmp/uv-release.tar.gz uv-x86_64-unknown-linux-gnu/uv > /usr/local/bin/uv; \\
              echo "fa5fc652fa5ed5b44fa8e7dda507f27975c02f59643787fd8ab4bf36f1ba7438  /usr/local/bin/uv" | sha256sum -c -; \\
              chmod 0755 /usr/local/bin/uv; \\
              rm /tmp/uv-release.tar.gz
          COPY marker /opt/ale-uv-test-marker
          '''
          for variant in ('a','b'):
              folder=root/('uv-'+variant)
              (folder/'Dockerfile').write_text(dockerfile)
              (folder/'marker').write_text(variant+'\n')
          PY
          docker build -t ale-uv-release:a "$RUNNER_TEMP/uv-a"
          docker build -t ale-uv-release:b "$RUNNER_TEMP/uv-b"
          for variant in a b; do
            docker run --rm --entrypoint /bin/sh "ale-uv-release:$variant" -c 'sha256sum /usr/local/bin/uv; stat -c "uid=%u gid=%g mode=%a" /usr/local/bin/uv'
          done
      - name: Verify the uv layer is shared
        run: |
          python3 - <<'PY'
          import json, subprocess
          def layers(tag):
              data=json.loads(subprocess.check_output(['docker','image','inspect','ale-uv-release:'+tag],text=True))
              return data[0]['RootFS']['Layers']
          a,b=layers('a'),layers('b')
          assert len(a)==len(b) and len(a)>1
          assert a[:-1]==b[:-1] and a[-1]!=b[-1], 'The shared uv layer was not reused'
          print('Shared base and pinned uv layer; distinct task layers:',len(a)-1,'shared layers')
          PY
          docker system df -v | head -20
