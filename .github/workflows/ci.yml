name: v1.1 artifact selection hosted validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen --all-groups
      - run: images/build.sh container-ubuntu22
      - name: Exercise artifact collection and separate verification in Docker
        run: >-
          uv run pytest -v tests/integration/test_task_local_verification.py
          -k 'selected_files_restore_link_contents_without_unrelated_links
          or selected_missing_file_reaches_verifier_as_missing
          or regular_file_selection_restores_only_real_top_level_files
          or patterned_files_restore_links_and_record_unreadable
          or unreadable_selected_file_is_omitted_for_separate_verification
          or regular_selection_and_subtree_restore_submission_type
          or selected_file_directory_reaches_separate_verifier_without_contents
          or selected_missing_root_reaches_verifier_as_missing
          or missing_excluded_root_reaches_verifier_when_opted_in
          or selected_directory_preserves_solver_files_for_separate_verifier
          or selected_directory_cannot_read_framework_only_file
          or selected_symlink_cannot_read_framework_only_file'
