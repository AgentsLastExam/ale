name: v1.1 validation artifact policy hosted check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen --all-groups
      - run: images/build.sh container-ubuntu22-base
      - name: Validate with and without artifact collection in Docker
        run: >-
          uv run pytest -v tests/integration/test_validation_observation.py
          -k test_validation_respects_artifact_policy_for_shared_verification
