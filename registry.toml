# Domain namespace -> task repository.
#
# Several domains may share one repository (each with its own subpath), which is how
# the Agents' Last Exam collection keeps its existing task identifiers: `demo/hello`
# stays `demo/hello` after conversion.
#
# Resolution: `ale run <domain>/<task>` fetches the repository at `default_ref` into
# the shared cache and reads `<path>/<task>`. Override the pin with `--tasks-ref`.

[domains.demo]
repo = "https://github.com/rdi-berkeley/agents-last-exam.git"
path = "tasks/demo"
default_ref = "main"

# Subject domains are registered as their tasks are converted to the new format.
# [domains.business_finance]
# repo = "https://github.com/rdi-berkeley/agents-last-exam.git"
# path = "tasks/business_finance"
# default_ref = "main"
