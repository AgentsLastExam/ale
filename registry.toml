# Domain namespace -> task repository.
#
# Several domains may share one repository, each under its own subpath. The identifier a
# task ends up with is derived from its folder path and is opaque, so moving a task
# between subpaths is a rename, not a schema change.
#
# Resolution: `ale run <domain>/<task>` fetches the repository at `default_ref` into the
# shared cache and reads `<path>/<task>`. Override the pin with `--tasks-ref`.

[domains.demo]
repo = "https://github.com/AgentsLastExam/ale-tasks-152.git"
path = "tasks/demo"
default_ref = "main"

# Subject domains are registered as their tasks are rebuilt to the current standard.
# The previous framework's repository is source material only — never a run-time source.
# [domains.business_finance]
# repo = "https://github.com/AgentsLastExam/ale-tasks-152.git"
# path = "tasks/business_finance"
# default_ref = "main"
